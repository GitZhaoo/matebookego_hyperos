# gaokun3 GPU 频率调度配置
# ──────────────────────────────────────────────────────────────────
# 修改后执行以下命令立即生效（无需重启）：
#   adb shell su -c 'sh /data/adb/modules/gaokun3_gpu_freq/apply.sh'
# 或重启后自动生效。
#
# 用户自定义配置的持久副本位于 /data/adb/gaokun3_gpu_freq.conf
# （模块目录下的这份是默认值；apply.sh / service.sh 会优先读持久副本）。

# ── 模式 ──────────────────────────────────────────────────────────
# fixed    = 固定锁定 GPU 最低频率为 FIXED_FREQ（不随屏幕状态变化）
# dynamic  = 息屏时降到 SCREEN_OFF_FREQ，亮屏时升到 SCREEN_ON_FREQ
MODE=fixed

# ── fixed 模式参数 ────────────────────────────────────────────────
# 从以下 8 档中选一个（单位 Hz）：
#   270000000   270 MHz  (默认最低档，最省电)
#   410000000   410 MHz
#   500000000   500 MHz
#   547000000   547 MHz  (实测：90th 15ms, missed vsync 1)
#   606000000   606 MHz
#   640000000   640 MHz
#   655000000   655 MHz
#   690000000   690 MHz  (最高档，实测：90th 5-6ms, missed vsync 0)
FIXED_FREQ=690000000

# ── dynamic 模式参数 ──────────────────────────────────────────────
# 亮屏时的 GPU 最低频率（建议 690000000，保证滑动流畅）
SCREEN_ON_FREQ=690000000

# 息屏时的 GPU 最低频率（建议 270000000，省电降温）
SCREEN_OFF_FREQ=270000000

# 轮询间隔（秒）。每次读取背光亮度判断屏幕状态。2 秒足够灵敏，CPU 开销可忽略。
POLL_INTERVAL=2
